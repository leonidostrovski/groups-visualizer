name: Attach Release Asset
on:
  release:
    types: [published]

jobs:
  attach-asset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Upload groups-visualizer.js to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/groups-visualizer.js
